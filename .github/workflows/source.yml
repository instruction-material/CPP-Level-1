name: Course source

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify inventory, native builds and foundation contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CXX: clang++
          CLASSES_FAMILY_TASK_ID: cpp-foundation-source-ci
        run: bash verify-course-source.sh
      - name: Verify separate CMake targets
        run: |
          cmake -S . -B "$RUNNER_TEMP/cpp-foundations" -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$RUNNER_TEMP/cpp-foundations" --parallel 2
